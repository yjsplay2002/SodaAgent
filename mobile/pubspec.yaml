name: soda_agent
description: "Soda - AI Car Voice Assistant"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_auth: ^6.0.2
  firebase_core: ^4.1.1
  web_socket_channel: ^3.0.0
  flutter_riverpod: ^2.4.0
  geolocator: ^13.0.2
  google_sign_in: ^7.2.0
  flutter_sound:
    path: third_party/flutter_sound
  logger: ^2.0.0
  http: ^1.2.2
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
